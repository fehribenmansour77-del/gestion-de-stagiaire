<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architecture MVC - StageFlow</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            position: relative;
            width: 800px;
            height: 500px;
            border: 1px solid #eee;
        }
        .box {
            position: absolute;
            width: 180px;
            height: 100px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            padding: 10px;
        }
        .model {
            background-color: #2e7d32; /* Green */
            bottom: 50px;
            left: 310px;
        }
        .view {
            background-color: #0277bd; /* Blue */
            top: 50px;
            left: 50px;
        }
        .controller {
            background-color: #ef6c00; /* Orange */
            top: 50px;
            right: 50px;
        }
        .title {
            font-size: 24px;
            color: #333;
            text-align: center;
            margin-top: 20px;
            width: 100%;
        }
        .subtitle {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 5px;
        }
        /* Arrows and Lines */
        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        .label {
            position: absolute;
            font-size: 12px;
            color: #666;
            background: white;
            padding: 2px 5px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">Organisation Logique MVC - StageFlow</div>
        
        <div class="box view">
            Vue
            <div class="subtitle">React.js<br>Interface Utilisateur</div>
        </div>

        <div class="box controller">
            Contrôleur
            <div class="subtitle">Express.js API<br>Logique Métier</div>
        </div>

        <div class="box model">
            Modèle
            <div class="subtitle">Sequelize ORM<br>MySQL Database</div>
        </div>

        <svg viewBox="0 0 800 500">
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#666" />
                </marker>
            </defs>
            <!-- View to Controller -->
            <line x1="230" y1="100" x2="570" y2="100" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)" />
            <!-- Controller to Model -->
            <line x1="660" y1="150" x2="490" y2="350" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)" />
            <!-- Model to View -->
            <line x1="310" y1="350" x2="140" y2="150" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)" />
        </svg>

        <div class="label" style="top: 80px; left: 350px;">1. Actions Utilisateur</div>
        <div class="label" style="top: 250px; right: 230px;">2. Requêtes Données</div>
        <div class="label" style="top: 250px; left: 160px;">3. Retour Données</div>
    </div>
</body>
</html>
