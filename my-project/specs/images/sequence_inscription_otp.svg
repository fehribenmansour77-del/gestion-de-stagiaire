<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="white" />
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Figure 4.1 - Inscription avec Vérification Email OTP</text>
  
  <!-- Participants -->
  <rect x="50" y="70" width="120" height="40" rx="5" fill="#E3F2FD" stroke="#1565C0" />
  <text x="110" y="95" font-family="Arial" font-size="14" text-anchor="middle">Candidat</text>
  <line x1="110" y1="110" x2="110" y2="550" stroke="#1565C0" stroke-dasharray="5,5" />

  <rect x="340" y="70" width="120" height="40" rx="5" fill="#FFF3E0" stroke="#EF6C00" />
  <text x="400" y="95" font-family="Arial" font-size="14" text-anchor="middle">Backend</text>
  <line x1="400" y1="110" x2="400" y2="550" stroke="#EF6C00" stroke-dasharray="5,5" />

  <rect x="630" y="70" width="120" height="40" rx="5" fill="#E8F5E9" stroke="#2E7D32" />
  <text x="690" y="95" font-family="Arial" font-size="14" text-anchor="middle">Service Mail</text>
  <line x1="690" y1="110" x2="690" y2="550" stroke="#2E7D32" stroke-dasharray="5,5" />

  <!-- Steps -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <path d="M 110 150 L 400 150" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="250" y="140" font-family="Arial" font-size="11" text-anchor="middle">1. POST /send-otp (email)</text>

  <path d="M 400 190 L 690 190" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="545" y="180" font-family="Arial" font-size="11" text-anchor="middle">2. Envoi Email (Code OTP)</text>

  <path d="M 690 230 L 110 230" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="400" y="220" font-family="Arial" font-size="11" text-anchor="middle">3. Réception du code</text>

  <path d="M 110 280 L 400 280" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="250" y="270" font-family="Arial" font-size="11" text-anchor="middle">4. POST /verify-otp (code)</text>

  <path d="M 400 320 L 110 320" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="250" y="310" font-family="Arial" font-size="11" text-anchor="middle">5. Succès + Token temporaire</text>

  <path d="M 110 370 L 400 370" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="250" y="360" font-family="Arial" font-size="11" text-anchor="middle">6. POST /register (form + token)</text>

  <rect x="400" y="400" width="80" height="30" rx="3" fill="#eee" stroke="#999" />
  <text x="440" y="420" font-family="Arial" font-size="10" text-anchor="middle">Hash password</text>

  <path d="M 400 460 L 110 460" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="250" y="450" font-family="Arial" font-size="11" text-anchor="middle">7. Confirmation &amp; JWT Session</text>
</svg>
