<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="white" />
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#333">Figure 3.4 : Diagramme de contexte statique de StageFlow</text>

  <!-- Definitions for arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555" />
    </marker>
  </defs>

  <!-- Central System -->
  <rect x="300" y="250" width="200" height="100" rx="15" fill="#BBDEFB" stroke="#1976D2" stroke-width="3" />
  <text x="400" y="295" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#0D47A1">STAGEFLOW</text>
  <text x="400" y="320" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#0D47A1">(Système central)</text>

  <!-- Actors / External Systems -->
  
  <!-- Admin RH -->
  <rect x="50" y="100" width="150" height="80" rx="5" fill="#F5F5F5" stroke="#757575" stroke-width="2" />
  <text x="125" y="145" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Admin RH</text>
  
  <!-- Candidat -->
  <rect x="600" y="100" width="150" height="80" rx="5" fill="#F5F5F5" stroke="#757575" stroke-width="2" />
  <text x="675" y="145" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Candidat</text>

  <!-- Tuteur -->
  <rect x="50" y="420" width="150" height="80" rx="5" fill="#F5F5F5" stroke="#757575" stroke-width="2" />
  <text x="125" y="465" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Tuteur</text>

  <!-- Serveur SMTP / SMS -->
  <rect x="600" y="420" width="150" height="80" rx="5" fill="#FFF9C4" stroke="#FBC02D" stroke-width="2" />
  <text x="675" y="465" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Services Externes</text>
  <text x="675" y="485" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#555">(SMTP / SMS API)</text>

  <!-- Flows -->
  <!-- Admin RH to System -->
  <path d="M 125 180 L 300 270" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)" />
  <text x="180" y="240" font-family="Arial, sans-serif" font-size="11" fill="#444" transform="rotate(25, 180, 240)">Gestion &amp; Validation</text>

  <!-- Candidat to System -->
  <path d="M 675 180 L 500 270" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)" />
  <text x="530" y="240" font-family="Arial, sans-serif" font-size="11" fill="#444" transform="rotate(-25, 530, 240)">Inscription &amp; Candidature</text>

  <!-- Tuteur to System -->
  <path d="M 125 420 L 300 330" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)" />
  <text x="180" y="370" font-family="Arial, sans-serif" font-size="11" fill="#444" transform="rotate(-25, 180, 370)">Évaluation &amp; Présences</text>

  <!-- System to Services -->
  <path d="M 500 330 L 600 420" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)" />
  <text x="560" y="370" font-family="Arial, sans-serif" font-size="11" fill="#444" transform="rotate(40, 560, 370)">Envoi Notifications</text>
</svg>
